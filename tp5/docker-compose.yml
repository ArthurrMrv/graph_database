services:
  neo4j:
    image: neo4j:5.20
    container_name: tp5_neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_heap_initial__size: 1G
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - tp5_network

  app:
    image: python:3.11-slim
    container_name: tp5_app
    working_dir: /work/app
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      # Connect to host Ollama
      OLLAMA_BASE_URL: http://host.docker.net:11434
      # Placeholder for Diffbot Key
      DIFFBOT_API_KEY: ${DIFFBOT_API_KEY:-INSERT_DIFFBOT_KEY_HERE}
    volumes:
      - ./app:/work/app
    command: bash -c "pip install --no-cache-dir -r requirements.txt && bash start.sh"
    depends_on:
      neo4j:
        condition: service_healthy
    extra_hosts:
      - "host.docker.net:host-gateway"
    networks:
      - tp5_network

volumes:
  neo4j_data:
  neo4j_import:
  neo4j_logs:


networks:
  tp5_network:
    driver: bridge
